name: Check public skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: generic-skill/apple-health-sync/requirements.txt
      - run: python -m pip install -r generic-skill/apple-health-sync/requirements.txt
      - run: python -m unittest discover -s generic-skill/apple-health-sync/scripts -p 'test_*.py' -v
